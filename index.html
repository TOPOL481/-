<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Смена цвета фона</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      transition: background-color 0.3s ease;
    }
    .panel {
      text-align: center;
      padding: 32px 40px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    .counter {
      font-size: 1rem;
      color: #555;
      margin-bottom: 20px;
    }
    .counter strong {
      font-size: 1.5rem;
      color: #222;
    }
    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #222;
      color: #fff;
    }
    button:hover {
      background: #444;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="panel">
    <p class="counter">Смен цвета: <strong id="count">0</strong></p>
    <button id="btn" type="button">Сменить фон</button>
  </div>

  <script>
    const colors = [
      "#fca5a5", "#fb923c", "#fde047", "#86efac", "#5eead4",
      "#93c5fd", "#a5b4fc", "#c4b5fd", "#f0abfc", "#fda4af",
      "#fdba74", "#bef264", "#67e8f9", "#7dd3fc", "#818cf8",
      "#e879f9", "#f472b6", "#fcd34d", "#34d399", "#38bdf8"
    ];

    let index = 0;
    let changeCount = 0;

    const countEl = document.getElementById("count");
    const btn = document.getElementById("btn");

    btn.addEventListener("click", () => {
      index = (index + 1) % colors.length;
      document.body.style.backgroundColor = colors[index];
      changeCount += 1;
      countEl.textContent = changeCount;
    });
  </script>
</body>
</html>
